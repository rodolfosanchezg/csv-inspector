<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSV Inspector</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="inspector">
      <section class="inspector-card" aria-labelledby="page-title">
        <header>
          <h1 id="page-title">CSV Inspector</h1>
          <p>
            Select a CSV file from your computer to inspect its contents.
          </p>
        </header>

        <form>
          <label for="csv-file">Choose a CSV file</label>
          <input id="csv-file" name="csv-file" type="file" accept=".csv,text/csv" />
        </form>

        <p class="file-name" aria-live="polite">File: No file selected</p>

        <section class="results" aria-labelledby="results-title">
          <h2 id="results-title">Results</h2>
          <dl>
            <div>
              <dt>Records</dt>
              <dd id="record-count">-</dd>
            </div>
            <div>
              <dt>Columns</dt>
              <dd id="column-count">-</dd>
            </div>
          </dl>

          <section id="column-names-section" aria-labelledby="column-names-title" hidden>
            <h3 id="column-names-title">Column Names</h3>
            <ul id="column-names" aria-live="polite"></ul>
          </section>
        </section>
      </section>
    </main>

    <script src="js/csv-counting.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
